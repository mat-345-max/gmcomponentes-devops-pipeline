services:
  groq-proxy:
    build: ./groq-proxy
    ports:
      - "8787:8787"
    env_file:
      - ./groq-proxy/.env
    mem_limit: 512m
    cpus: "0.5"
    depends_on:
      agente:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agente:
    build: ./agente
    ports:
      - "8790:8790"
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8790/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  frontend:
    build: .
    ports:
      - "8080:80"
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
