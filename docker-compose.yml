services:
  groq-proxy:
    build: ./groq-proxy
    ports:
      - "8787:8787"
    env_file:
      - ./groq-proxy/.env
    mem_limit: 512m
    cpus: "0.5"
    environment:
      - AGENT_SERVICE_URL=http://agente-lb
    depends_on:
      agente-lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agente:
    build: ./agente
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8790/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agente-lb:
    build:
      context: .
      dockerfile: Dockerfile.lb
    ports:
      - "8791:80"
    depends_on:
      - agente
    mem_limit: 64m
    cpus: "0.1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  frontend:
    build: .
    ports:
      - "8080:80"
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
