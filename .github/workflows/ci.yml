name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  backend-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: groq-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Tests de groq-proxy con cobertura
        run: npm test -- --coverage
      - name: Exportar cobertura de groq-proxy a JSON
        run: node -e "const t=require('./coverage/coverage-summary.json').total; require('fs').writeFileSync('cobertura-groq-proxy.json', JSON.stringify({service:'groq-proxy',coverage_percent:t.statements.pct}))"
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-groq-proxy
          path: groq-proxy/cobertura-groq-proxy.json

  agente-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -c "import ev3_bridge" || echo "revisar import"
      - run: pip install -r requirements-dev.txt
      - name: Tests del agente con cobertura
        run: python -m pytest tests -v --cov
      - name: Exportar cobertura del agente a JSON
        run: |
          python -m coverage json -o coverage.json
          python -c "import json; p=json.load(open('coverage.json'))['totals']['percent_covered']; json.dump({'service':'agente','coverage_percent':round(p,2)}, open('cobertura-agente.json','w'))"
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-agente
          path: agente/cobertura-agente.json
  docker-build-deploy:
    runs-on: ubuntu-latest
    needs: [backend-node, agente-python, observability-tests, security-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env de prueba para CI
        run: |
          cat > groq-proxy/.env <<EOF
          PORT=8787
          GROQ_API_KEY=dummy
          GROQ_MODEL=openai/gpt-oss-20b
          VOYAGE_API_KEY=dummy
          MONGODB_URI=mongodb://localhost:27017/faq_logs
          MONGODB_DB=faq_logs
          MONGODB_COLLECTION=gm_componentes_logs_faq
          EOF
      - name: Build imágenes Docker
        run: docker compose build
      - name: Levantar servicios (despliegue simulado)
        run: docker compose up -d --wait
      - name: Verificar que los servicios respondan
        run: |
          curl --fail http://localhost:8791/health
          curl --fail http://localhost:8787/api/health
          curl --fail http://localhost:8080/healthz
      - name: Apagar servicios
        run: docker compose down

  observability-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest ev3_observability/tests -v --cov=ev3_observability

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          pip install -r agente/requirements.txt
          cd groq-proxy && npm install

      - uses: snyk/actions/setup@master

      - name: Snyk dependencias del agente (Python)
        run: snyk test --file=agente/requirements.txt --package-manager=pip --severity-threshold=high --policy-path=.snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk dependencias de groq-proxy (Node)
        working-directory: groq-proxy
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Code (análisis del código fuente)
        run: snyk code test --severity-threshold=high --policy-path=.snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: [backend-node, agente-python, observability-tests, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Crear clúster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: gmcomponentes

      - name: Construir imágenes
        run: |
          docker build -t groq-proxy:ci ./groq-proxy
          docker build -t agente:ci ./agente
          docker build -t frontend:ci .

      - name: Cargar imágenes en kind
        run: kind load docker-image groq-proxy:ci agente:ci frontend:ci --name gmcomponentes

      - name: Registrar inicio del despliegue
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Crear namespace y Secret de prueba
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret generic groq-proxy-secret -n gmcomponentes \
            --from-literal=GROQ_API_KEY=dummy \
            --from-literal=VOYAGE_API_KEY=dummy \
            --from-literal=MONGODB_URI=mongodb://localhost:27017/faq_logs

      - name: Aplicar manifiestos
        run: kubectl apply -f k8s/

      - name: Esperar a que los despliegues estén disponibles
        run: |
          kubectl rollout status deployment/groq-proxy -n gmcomponentes --timeout=180s
          kubectl rollout status deployment/agente -n gmcomponentes --timeout=180s
          kubectl rollout status deployment/frontend -n gmcomponentes --timeout=180s

      - name: Calcular duración del despliegue
        run: |
          DEPLOY_SECONDS=$(( $(date +%s) - DEPLOY_START ))
          echo "DEPLOY_SECONDS=$DEPLOY_SECONDS" >> "$GITHUB_ENV"
          echo "Duración del despliegue en k8s: ${DEPLOY_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar servicios (smoke test)
        run: |
          kubectl port-forward -n gmcomponentes svc/groq-proxy 8787:8787 &
          kubectl port-forward -n gmcomponentes svc/agente 8790:8790 &
          kubectl port-forward -n gmcomponentes svc/frontend 8080:80 &
          sleep 5
          curl --fail http://localhost:8787/api/health
          curl --fail http://localhost:8790/health
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8787/metrics > /dev/null
          curl --fail http://localhost:8790/metrics > /dev/null

      - name: Diagnóstico si algo falla
        if: failure()
        run: |
          kubectl get pods -n gmcomponentes -o wide
          kubectl describe pods -n gmcomponentes
          kubectl logs -n gmcomponentes -l app=groq-proxy --tail=50 || true
          kubectl logs -n gmcomponentes -l app=agente --tail=50 || true
