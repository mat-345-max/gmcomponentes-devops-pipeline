name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  backend-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: groq-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint --if-present

  agente-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -c "import ev3_bridge" || echo "revisar import"
  docker-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env de prueba para CI
        run: |
          cat > groq-proxy/.env <<EOF
          PORT=8787
          GROQ_API_KEY=dummy
          GROQ_MODEL=openai/gpt-oss-20b
          VOYAGE_API_KEY=dummy
          MONGODB_URI=mongodb://localhost:27017/faq_logs
          MONGODB_DB=faq_logs
          MONGODB_COLLECTION=gm_componentes_logs_faq
          EOF
      - name: Build imágenes Docker
        run: docker compose build
      - name: Levantar servicios (despliegue simulado)
        run: docker compose up -d --wait
      - name: Verificar que los servicios respondan
        run: |
          curl --fail http://localhost:8790/health
          curl --fail http://localhost:8787/api/health
      - name: Apagar servicios
        run: docker compose down
