name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  backend-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: groq-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  agente-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -c "import ev3_bridge" || echo "revisar import"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -v
  docker-build-deploy:
    runs-on: ubuntu-latest
    needs: [backend-node, agente-python, observability-tests, security-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env de prueba para CI
        run: |
          cat > groq-proxy/.env <<EOF
          PORT=8787
          GROQ_API_KEY=dummy
          GROQ_MODEL=openai/gpt-oss-20b
          VOYAGE_API_KEY=dummy
          MONGODB_URI=mongodb://localhost:27017/faq_logs
          MONGODB_DB=faq_logs
          MONGODB_COLLECTION=gm_componentes_logs_faq
          EOF
      - name: Build imágenes Docker
        run: docker compose build
      - name: Levantar servicios (despliegue simulado)
        run: docker compose up -d --wait
      - name: Verificar que los servicios respondan
        run: |
          curl --fail http://localhost:8791/health
          curl --fail http://localhost:8787/api/health
          curl --fail http://localhost:8080/healthz
      - name: Apagar servicios
        run: docker compose down

  observability-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest ev3_observability/tests -v --cov=ev3_observability

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          pip install -r agente/requirements.txt
          cd groq-proxy && npm install

      - uses: snyk/actions/setup@master

      - name: Snyk dependencias del agente (Python)
        run: snyk test --file=agente/requirements.txt --package-manager=pip --severity-threshold=high --policy-path=.snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk dependencias de groq-proxy (Node)
        working-directory: groq-proxy
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Code (análisis del código fuente)
        run: snyk code test --severity-threshold=high --policy-path=.snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
