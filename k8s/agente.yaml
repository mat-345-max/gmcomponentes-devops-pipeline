apiVersion: v1
kind: ConfigMap
metadata:
  name: agente-config
  namespace: gmcomponentes
data:
  EV1_PROXY_URL: "http://groq-proxy:8787"
  CATALOG_API_URL: "https://gmcomponents.onrender.com/backend/products/"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agente
  namespace: gmcomponentes
  labels:
    app: agente
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agente
  template:
    metadata:
      labels:
        app: agente
    spec:
      containers:
        - name: agente
          image: agente:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8790
          envFrom:
            - configMapRef:
                name: agente-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agente
  namespace: gmcomponentes
  labels:
    app: agente
spec:
  type: ClusterIP
  selector:
    app: agente
  ports:
    - name: http
      port: 8790
      targetPort: http
