# Valores mínimos para correr kube-prometheus-stack en kind dentro de un runner de CI.
# Chart: prometheus-community/kube-prometheus-stack

defaultRules:
  create: false

alertmanager:
  enabled: false

nodeExporter:
  enabled: false

# En kind los componentes del plano de control no exponen métricas accesibles
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  # Solo para el entorno efímero del CI (el clúster se destruye al terminar el job)
  adminPassword: admin
  # Loki como fuente de datos de Grafana (se instala después, la URL se resuelve al consultar)
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100

prometheus:
  prometheusSpec:
    # El clúster vive pocos minutos: consultar seguido para tener datos en el dashboard
    scrapeInterval: 15s
    # Descubrir los ServiceMonitor de cualquier namespace sin exigir etiquetas de Helm
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false