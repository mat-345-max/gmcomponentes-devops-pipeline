apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: groq-proxy
  namespace: gmcomponentes
  labels:
    app: groq-proxy
spec:
  selector:
    matchLabels:
      app: groq-proxy
  namespaceSelector:
    matchNames:
      - gmcomponentes
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agente
  namespace: gmcomponentes
  labels:
    app: agente
spec:
  selector:
    matchLabels:
      app: agente
  namespaceSelector:
    matchNames:
      - gmcomponentes
  endpoints:
    - port: http
      path: /metrics
      interval: 15s